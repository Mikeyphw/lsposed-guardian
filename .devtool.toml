# Guardian's canonical repository contract, validated against Devtool 2026-10-21.
# All commands are routed through the generated Devtool wrapper; no secondary scheduler.
[project]
runner = "command"
platform = "android"

[workspace]
default_target = "guardian"

[workspace.scheduler]
parallel = false
max_parallel_nodes = 1

[wrapper]
schema = 2
default_command = "check"

[wrapper.commands.check]
description = "Devtool DAG: source checks, isolated tests, WebUI tests, build and archive verification"
workflow = "check"
target = "guardian"

[wrapper.commands.test]
description = "Run hermetic Guardian and WebUI tests via the Devtool workflow graph"
workflow = "test"
target = "guardian"

[wrapper.commands.syntax]
description = "POSIX shell, Python, TOML and repository-policy syntax"
workflow = "syntax"
target = "guardian"

[wrapper.commands.webui]
description = "Test complete KernelSU WebUI inventory and scopes"
workflow = "webui"
target = "guardian"

[wrapper.commands.build]
description = "Build and verify deterministic installable/source ZIPs"
workflow = "build"
target = "guardian"

[wrapper.commands.install]
description = "Full regression, qualification, build, verify, then interactive KernelSU install"
workflow = "install"
target = "guardian"

[wrapper.commands.live-quarantine-preview]
description = "Read-only gate preflight for RememberMySort; never toggles a module"
workflow = "live-quarantine-preview"
target = "guardian"

[wrapper.commands.live-quarantine-gate]
description = "EXPLICIT LIVE MUTATION: journaled RememberMySort disable then rollback, with device evidence"
workflow = "live-quarantine-gate"
target = "guardian"

[wrapper.commands.boot-order-stage]
description = "Opt in to a read-only next-reboot KernelSU boot ordering probe; no Vector changes"
workflow = "boot-order-stage"
target = "guardian"

[wrapper.commands.boot-order-status]
description = "Inspect recorded post-fs-data ordering and Vector health receipts"
workflow = "boot-order-status"
target = "guardian"

[wrapper.commands.boot-trial-stage]
description = "Explicitly stage a next-reboot COPY-ONLY Vector DB/WAL rehearsal; no live DB replacement"
workflow = "boot-trial-stage"
target = "guardian"

[wrapper.commands.boot-trial-status]
description = "Inspect real boot copy-only trial and stable Vector receipt"
workflow = "boot-trial-status"
target = "guardian"

[wrapper.commands.boot-trial-cancel]
description = "Cancel a staged (not in-progress) copy-only boot trial"
workflow = "boot-trial-cancel"
target = "guardian"

[wrapper.commands.early-boot-lab]
description = "Hermetic SQLite WAL transaction and restart-interruption simulation; no live restore"
workflow = "early-boot-lab"
target = "guardian"

[wrapper.commands.early-boot-preflight]
description = "Read-only early-boot recovery environment inventory; NEVER attempts restoration"
workflow = "early-boot-preflight"
target = "guardian"

[wrapper.commands.device-check]
description = "Read-only Guardian device acceptance with Termux clipboard output"
workflow = "device-check"
target = "guardian"

[wrapper.commands.preflight]
description = "Run Devtool-native workflow preflight through a first-class job"
workflow = "preflight"
target = "guardian"

[wrapper.commands.doctor]
description = "Run Devtool-native repository doctor through a first-class job"
workflow = "doctor"
target = "guardian"

[wrapper.commands.validate]
description = "Run Devtool-native validation planning/execution"
devtool = "validate"
target = "guardian"
allow_passthrough = true

[targets.guardian]
runner = "command"
platform = "android"
root = "."
execution_environment = "native-termux"
inputs = ["guardian.sh", "lib/**", "webroot/**", "tests/**", "tools/**", "module.prop", ".devtool.toml"]
outputs = ["dist/**"]

[targets.guardian.jobs.devtool-preflight]
runner = "command"
command = ["devtool", "-r", ".", "preflight"]
metadata = { read_only = true, native_devtool_operation = true }

[targets.guardian.jobs.devtool-doctor]
runner = "command"
command = ["devtool", "-r", ".", "doctor"]
metadata = { read_only = true, native_devtool_operation = true }

[targets.guardian.jobs.source-check]
runner = "command"
command = ["python3", "tools/check_repo.py"]
inputs = ["**/*.sh", "**/*.py", "webroot/**", ".devtool.toml", "module.prop"]
metadata = { read_only = true, family = "preflight" }

[targets.guardian.jobs.unit-tests]
runner = "command"
command = ["python3", "tools/run_host_tests.py", "--workers", "2", "--timeout", "180"]
inputs = ["guardian.sh", "lib/**", "tests/test_guardian.py", "tools/run_host_tests.py"]
metadata = { read_only = true, family = "unit" }

[targets.guardian.jobs.contract-tests]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_devtool_contract.py", "-q"]
inputs = [".devtool.toml", "tools/**", "tests/test_devtool_contract.py", "devtoolw", "devtoolw.cmd"]
metadata = { read_only = true, family = "contract" }

[targets.guardian.jobs.webui-tests]
runner = "command"
command = ["node", "tests/test_webui.js"]
inputs = ["webroot/**", "tests/test_webui.js"]
metadata = { read_only = true, family = "webui" }

[targets.guardian.jobs.ci-parity]
runner = "command"
command = ["python3", "tools/check_ci_parity.py"]
inputs = [".devtool.toml", ".github/workflows/**", "tools/check_ci_parity.py"]
metadata = { read_only = true, ci_mirror_contract = true }

[targets.guardian.jobs.host-qualification]
runner = "command"
command = ["python3", "tools/qualify_host.py"]
inputs = ["dist/host-test-results.json", "tests/test_guardian.py", "tools/qualify_host.py", ".devtool.toml"]
outputs = ["dist/host-qualification.json"]
metadata = { read_only = true, host_evidence_gate = true, device_qualified = false }

[targets.guardian.jobs.package]
runner = "command"
command = ["python3", "tools/build.py"]
inputs = ["guardian.sh", "lib/**", "webroot/**", "module.prop", "tools/build.py", "README.md", "docs/**"]
outputs = ["dist/**"]
metadata = { release_candidate = true, device_qualified = false }

[targets.guardian.jobs.verify-package]
runner = "command"
command = ["python3", "tools/verify_build.py"]
inputs = ["dist/**", "tools/verify_build.py", "module.prop"]
metadata = { read_only = true, artifact_digest_gate = true }

[targets.guardian.jobs.flash-ksu]
runner = "command"
command = ["sh", "tools/install.sh"]
inputs = ["dist/**", "tools/install.sh", "tools/verify_build.py"]
metadata = { interactive_terminal_required = true, mutations = "explicit-root-module-install", never_use_in_ci = true }

[targets.guardian.jobs.live-quarantine-preview]
runner = "command"
command = ["python3", "tools/live_quarantine_gate.py", "--preflight"]
inputs = ["tools/live_quarantine_gate.py"]
metadata = { device_required = true, root_required = true, read_only = true, scope = "eu.hxreborn.remembermysort" }

[targets.guardian.jobs.live-quarantine-apply]
runner = "command"
command = ["python3", "tools/live_quarantine_gate.py", "--apply"]
inputs = ["tools/live_quarantine_gate.py"]
metadata = { device_required = true, root_required = true, read_only = false, live_vector_mutation = true, authorized_target = "eu.hxreborn.remembermysort", never_use_in_ci = true }

[targets.guardian.jobs.boot-order-stage]
runner = "command"
command = ["sh", "tools/boot_probe_gate.sh", "stage"]
metadata = { root_required = true, explicit_opt_in = true, vector_mutation = false, boot_probe_marker = true, never_use_in_ci = true }

[targets.guardian.jobs.boot-order-status]
runner = "command"
command = ["sh", "tools/boot_probe_gate.sh", "status"]
metadata = { root_required = true, read_only = true, never_use_in_ci = true }

[targets.guardian.jobs.boot-trial-stage]
runner = "command"
command = ["sh", "tools/boot_trial_gate.sh", "stage"]
metadata = { root_required = true, explicit_opt_in = true, real_boot = true, copy_only = true, never_use_in_ci = true }

[targets.guardian.jobs.boot-trial-status]
runner = "command"
command = ["sh", "tools/boot_trial_gate.sh", "status"]
metadata = { root_required = true, read_only = true, never_use_in_ci = true }

[targets.guardian.jobs.boot-trial-cancel]
runner = "command"
command = ["sh", "tools/boot_trial_gate.sh", "cancel"]
metadata = { root_required = true, explicit_opt_in = true, never_use_in_ci = true }

[targets.guardian.jobs.boot-trial-tests]
runner = "command"
command = ["python3", "-S", "-m", "unittest", "discover", "-s", "tests", "-p", "test_boot_trial.py", "-q"]
inputs = ["lib/boot-trial.sh", "tests/test_boot_trial.py", "post-fs-data.sh", "service.sh"]
metadata = { read_only = true, isolated = true, device_qualified = false }

[targets.guardian.jobs.early-boot-model]
runner = "command"
command = ["python3", "tools/early_boot_transaction_lab.py"]
inputs = ["tools/early_boot_transaction_lab.py", "tests/test_early_boot_transaction_lab.py"]
outputs = ["dist/early-boot-prototype-lab.json"]
metadata = { read_only = true, isolated = true, device_qualified = false, production_restore_modified = false }

[targets.guardian.jobs.early-boot-inventory]
runner = "command"
command = ["python3", "tools/early_boot_preflight.py"]
inputs = ["tools/early_boot_preflight.py"]
metadata = { device_required = true, root_required = true, read_only = true, device_restoration_qualified = false }

[targets.guardian.jobs.device-diagnostics]
runner = "command"
command = ["sh", "tools/device_check.sh"]
inputs = ["tools/device_check.sh"]
metadata = { root_required = true, read_only = true, clipboard = "termux" }

# Workflow DAG with explicit prerequisites; no parallel writes to dist/.
[targets.guardian.workflows]
preflight = [{ id = "devtool-preflight", ref = "job:devtool-preflight", depends_on = [] }]
doctor = [{ id = "devtool-doctor", ref = "job:devtool-doctor", depends_on = [] }]
syntax = [{ id = "preflight", ref = "job:source-check", depends_on = [] }]
webui = [{ id = "ui", ref = "job:webui-tests", depends_on = [] }]
test = [
  { id = "preflight", ref = "job:source-check", depends_on = [] },
  { id = "unit", ref = "job:unit-tests", depends_on = ["preflight"] },
  { id = "contract", ref = "job:contract-tests", depends_on = ["preflight"] },
  { id = "ui", ref = "job:webui-tests", depends_on = ["preflight"] },
  { id = "ci-parity", ref = "job:ci-parity", depends_on = ["preflight"] },
  { id = "wal-model", ref = "job:early-boot-model", depends_on = ["preflight"] },
  { id = "boot-trial-tests", ref = "job:boot-trial-tests", depends_on = ["preflight"] },
]
build = [
  { id = "preflight", ref = "job:source-check", depends_on = [] },
  { id = "package", ref = "job:package", depends_on = ["preflight"] },
  { id = "verify", ref = "job:verify-package", depends_on = ["package"] },
]
check = [
  { id = "preflight", ref = "job:source-check", depends_on = [] },
  { id = "unit", ref = "job:unit-tests", depends_on = ["preflight"] },
  { id = "contract", ref = "job:contract-tests", depends_on = ["preflight"] },
  { id = "ui", ref = "job:webui-tests", depends_on = ["preflight"] },
  { id = "ci-parity", ref = "job:ci-parity", depends_on = ["preflight"] },
  { id = "wal-model", ref = "job:early-boot-model", depends_on = ["preflight"] },
  { id = "boot-trial-tests", ref = "job:boot-trial-tests", depends_on = ["preflight"] },
  { id = "qualification", ref = "job:host-qualification", depends_on = ["unit", "contract", "ui", "ci-parity", "wal-model", "boot-trial-tests"] },
  { id = "package", ref = "job:package", depends_on = ["qualification"] },
  { id = "verify", ref = "job:verify-package", depends_on = ["package"] },
]
install = [
  { id = "preflight", ref = "job:source-check", depends_on = [] },
  { id = "unit", ref = "job:unit-tests", depends_on = ["preflight"] },
  { id = "contract", ref = "job:contract-tests", depends_on = ["preflight"] },
  { id = "ui", ref = "job:webui-tests", depends_on = ["preflight"] },
  { id = "ci-parity", ref = "job:ci-parity", depends_on = ["preflight"] },
  { id = "wal-model", ref = "job:early-boot-model", depends_on = ["preflight"] },
  { id = "boot-trial-tests", ref = "job:boot-trial-tests", depends_on = ["preflight"] },
  { id = "qualification", ref = "job:host-qualification", depends_on = ["unit", "contract", "ui", "ci-parity", "wal-model", "boot-trial-tests"] },
  { id = "package", ref = "job:package", depends_on = ["qualification"] },
  { id = "verify", ref = "job:verify-package", depends_on = ["package"] },
  { id = "install", ref = "job:flash-ksu", depends_on = ["verify"] },
]
device-check = [{ id = "device", ref = "job:device-diagnostics", depends_on = [] }]
live-quarantine-preview = [{ id = "preflight", ref = "job:live-quarantine-preview", depends_on = [] }]
live-quarantine-gate = [{ id = "roundtrip", ref = "job:live-quarantine-apply", depends_on = [] }]
early-boot-preflight = [{ id = "inventory", ref = "job:early-boot-inventory", depends_on = [] }]
early-boot-lab = [{ id = "wal-model", ref = "job:early-boot-model", depends_on = [] }]
boot-order-stage = [{ id = "stage", ref = "job:boot-order-stage", depends_on = [] }]
boot-order-status = [{ id = "status", ref = "job:boot-order-status", depends_on = [] }]
boot-trial-stage = [{ id = "stage", ref = "job:boot-trial-stage", depends_on = [] }]
boot-trial-status = [{ id = "status", ref = "job:boot-trial-status", depends_on = [] }]
boot-trial-cancel = [{ id = "cancel", ref = "job:boot-trial-cancel", depends_on = [] }]

# First-class named test catalog (also selectable with canonical `devtool test`).
[[test]]
id = "guardian-shell"
name = "Guardian source syntax and repository policy"
runner = "command"
command = ["python3", "tools/check_repo.py"]
timeout_seconds = 120

[[test]]
id = "guardian-python"
name = "Hermetic fake-Vector regression"
runner = "command"
command = ["python3", "tools/run_host_tests.py", "--workers", "2", "--timeout", "180"]
timeout_seconds = 7200

[[test]]
id = "guardian-devtool-contract"
name = "Devtool workflow/wrapper/install provenance tests"
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_devtool_contract.py", "-q"]
timeout_seconds = 120

[[test]]
id = "guardian-webui"
name = "KernelSU WebUI full-output and scope regression"
runner = "command"
command = ["node", "tests/test_webui.js"]
timeout_seconds = 120

[[test]]
id = "guardian-early-boot-wal"
name = "Isolated SQLite WAL transaction and reboot-interruption simulator"
runner = "command"
command = ["python3", "tools/early_boot_transaction_lab.py"]
timeout_seconds = 120

[[test]]
id = "guardian-boot-trial"
name = "Hermetic real-boot copy-only WAL rehearsal fixture"
runner = "command"
command = ["python3", "-S", "-m", "unittest", "discover", "-s", "tests", "-p", "test_boot_trial.py", "-q"]
timeout_seconds = 180
